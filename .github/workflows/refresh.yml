name: Refresh admission data

on:
  schedule:
    # Pakistan Standard Time (PKT) is UTC+5, no daylight saving.
    # Off-peak minutes (07/13) avoid GitHub's top-of-hour scheduler load.
    - cron: '7 7 * * 1'    # Monday 07:07 UTC  = 12:07 PKT (midday)
    - cron: '7 13 * * 5'   # Friday 13:07 UTC  = 18:07 PKT (end of day)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Scrape admission data
        run: node scripts/scrape.mjs

      - name: Open pull request with changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh admission data'
          title: 'Admission data refresh'
          body: |
            Automated scrape of admission dates. Review before merging —
            merging into main redeploys the site.
          branch: data-refresh
          delete-branch: true
