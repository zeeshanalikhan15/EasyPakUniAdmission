name: Deploy

on:
  push:
    branches:
      - main
  workflow_run:
    # Deploy right after any scraper finishes (GITHUB_TOKEN pushes don't
    # re-trigger this workflow via `push`, so chain it explicitly).
    workflows:
      - Scrape FAST
      - Scrape GIKI
      - Scrape LUMS
      - Scrape NUST
      - Scrape PIEAS
      - Scrape PUCIT
      - Scrape UET
    types: [completed]
  schedule:
    # Daily safety net — deploys the latest data even if a scrape was missed.
    - cron: "17 18 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Set Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          npm run deploy:prod
