name: Scrape PUCIT

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm ci
      - name: Scrape PUCIT admission schedule
        run: node scripts/scrapers/pucit.mjs
      - name: Validate data
        run: node scripts/validate.mjs pucit
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change."
          else
            git add src/data/pucit.json
            git commit -m "chore: update PUCIT admission data (scraper)"
            git push
          fi
