name: Scrape LUMS

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm ci
      - name: Scrape LUMS admission schedule
        run: node scripts/scrapers/lums.mjs
      - name: Validate data
        run: node scripts/validate.mjs lums
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change."
          else
            git add src/data/lums.json
            git commit -m "chore: update LUMS admission data (scraper)"
            git push
          fi
