name: Scrape FAST

on:
  schedule:
    - cron: "0 2 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm ci
      - name: Scrape FAST admission schedule
        run: node scripts/scrapers/fast.mjs
      - name: Validate data
        run: node scripts/validate.mjs fast
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change."
          else
            git add src/data/fast.json
            git commit -m "chore: update FAST admission data (scraper)"
            git push
          fi
