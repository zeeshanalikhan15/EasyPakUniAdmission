name: Scrape NUST

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Scrape NUST admission schedule
        run: node scripts/scrapers/nust.mjs
      - name: Validate data
        run: node scripts/validate.mjs nust
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No change."
          else
            git add src/data/nust.json
            git commit -m "chore: update NUST admission data (scraper)"
            git push
          fi
